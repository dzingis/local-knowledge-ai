version: "3.9"

services:

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    container_name: lkai-backend
    restart: unless-stopped

    env_file:
      - .env

    environment:
      WATCH_ENABLED: "${WATCH_ENABLED:-false}"
      WATCH_FOLDERS: "${WATCH_FOLDERS:-/knowledge}"
      WATCH_RECURSIVE: "${WATCH_RECURSIVE:-true}"
      WATCH_DEBOUNCE_SECONDS: "${WATCH_DEBOUNCE_SECONDS:-2}"
      WATCH_POLL_INTERVAL: "${WATCH_POLL_INTERVAL:-30}"
      WATCH_IGNORE_PATTERNS: "${WATCH_IGNORE_PATTERNS:-~$*,*.tmp,*.part}"

    ports:
      - "${BACKEND_PORT}:8000"

    depends_on:
      - qdrant

    volumes:
      - ./backend:/app/backend
      - "${WATCH_HOST_PATH:-./knowledge}:/knowledge"

    networks:
      - lkai


  qdrant:
    image: qdrant/qdrant:latest
    container_name: lkai-qdrant

    restart: unless-stopped

    ports:
      - "${QDRANT_PORT}:6333"

    volumes:
      - qdrant_storage:/qdrant/storage

    networks:
      - lkai


  open-webui:
    image: ghcr.io/open-webui/open-webui:main

    container_name: lkai-webui

    restart: unless-stopped

    depends_on:
      - qdrant

    environment:
      OLLAMA_BASE_URL: http://host.docker.internal:11434

    ports:
      - "${OPENWEBUI_PORT}:8080"

    volumes:
      - webui:/app/backend/data

    networks:
      - lkai


networks:

  lkai:


volumes:

  qdrant_storage:

  webui: